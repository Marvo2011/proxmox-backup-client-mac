# FUSE (`mount`/`map`) uses FUSE-T, which has to be installed for building
# (https://www.fuse-t.org). libfuse3 is linked weakly, so the binaries also run
# without it, see proxmox-fuse's `available()`.
[target.'cfg(target_os = "macos")']
rustflags = [
    "-L", "native=/usr/local/lib",
    "-C", "link-arg=-Wl,-weak-lfuse3",
    "-C", "link-arg=-Wl,-rpath,/usr/local/lib",
]

# Proxmox crates are taken from vendor/, which carries the macOS changes, see
# vendor/README.md. Paths are relative to the repository root.
[patch.crates-io]
proxmox-api-macro = { path = "vendor/proxmox/proxmox-api-macro" }
proxmox-async = { path = "vendor/proxmox/proxmox-async" }
proxmox-auth-api = { path = "vendor/proxmox/proxmox-auth-api" }
proxmox-borrow = { path = "vendor/proxmox/proxmox-borrow" }
